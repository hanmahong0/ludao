[package]
name = "gap-engine"
version = "0.1.0"
edition = "2021"
description = "Deterministic evidence-chain gap diagnosis engine (rust-core, A-stage / local CEL)."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# CEL evaluator for gapRules[].when — mutation-free, terminating, host-injected
# whitelist functions only (A-stage red line). No network / no LLM.
cel-interpreter = "0.10"
